name: raider

on:
  workflow_dispatch:

concurrency:
  group: raider
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala deps
        run: |
          pip install --quiet -r requirements.txt
      - name: Roda raider
        env:
          DISCORD_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python -u nuke_bot.py