name: selfbot

on:
  workflow_dispatch:
  schedule:
    # reinicia a cada ~5h (live 24/7, repo publico = Actions ilimitado)
    - cron: '15 */5 * * *'

concurrency:
  group: selfbot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala deps
        run: |
          pip install --quiet discord.py-self Pillow
      - name: Roda selfbot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ALT_TOKEN: ${{ secrets.ALT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          echo "$WEBHOOK_URL" > /tmp/webhook_url.txt
          python -u selfbot.py